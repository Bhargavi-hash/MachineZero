[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machinezero"
version = "0.1.0"
description = "Learning to understand computers never seen before."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Bhargavi Kurukunda"}]
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.2", "typer>=0.12", "rich>=13", "PyYAML>=6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
machinezero = "machinezero.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
